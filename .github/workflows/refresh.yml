name: Refresh rankings and website cache

on:
  schedule:
    # Tuesday at 08:00 UTC: 4 AM EDT / 3 AM EST.
    - cron: "0 8 * * 2"
    # Daily cache refresh only; never imports an additional week.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rankings-and-cache-refresh
  cancel-in-progress: false

env:
  BACKEND_URL: https://fantasy-power-rankings-backend.onrender.com
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate cache configuration
        run: |
          test -n "$FRONTEND_URL" || { echo 'Set the FRONTEND_URL repository variable'; exit 1; }
          case "$FRONTEND_URL" in
            https://*) ;;
            *) echo 'FRONTEND_URL must use HTTPS'; exit 1 ;;
          esac

      - name: Wake the backend before refreshing
        run: |
          curl --fail-with-body --silent --show-error --max-time 180 \
            --retry 3 --retry-delay 10 "$BACKEND_URL/" > /dev/null

      - name: Import the next week on Tuesday only
        if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 2'
        run: |
          # Do not retry this POST: it advances to the next week on each call.
          curl --fail-with-body --silent --show-error --max-time 180 \
            -X POST "$BACKEND_URL/refresh" -o refresh-result.json
          jq -e '.teams > 0 and (.season_stats | type == "array" and length > 0)' refresh-result.json

      - name: Invalidate and warm the frontend data cache
        run: |
          curl --fail-with-body --silent --show-error --max-time 180 \
            --retry 3 --retry-delay 10 \
            -X POST "${FRONTEND_URL%/}/api/revalidate"
